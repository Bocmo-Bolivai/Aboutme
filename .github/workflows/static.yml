<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutsch Duo</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f5f4; --surface: #ffffff; --fg: #14211e; --muted: #5c6b67; --line: #d8dfdc;
    --accent: #0b7a68; --accent-fg: #ffffff; --soft: #e3f1ed;
    --good: #1c7c3b; --good-bg: #e0f3e5; --bad: #b3412c; --bad-bg: #fbe6e1; --star: #c98a00;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    --arabic: "Noto Naskh Arabic", "Amiri", "Geeza Pro", "Segoe UI", Tahoma, Arial, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1816; --surface: #15231f; --fg: #e6efec; --muted: #94a8a2; --line: #263a35;
      --accent: #3cc2a8; --accent-fg: #06201a; --soft: #1b332d;
      --good: #6fd68e; --good-bg: #17331f; --bad: #ee8a73; --bad-bg: #3a1f19; --star: #f0b429;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body); padding: 20px 16px 56px; }
  main { max-width: 780px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font: 700 1.9rem/1.1 var(--display); margin: 0; letter-spacing: -0.02em; }
  h2 { font: 600 1.05rem var(--display); margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 4px 0 0; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab { flex: 1 1 0; min-width: 76px; padding: 10px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .stat b { display: block; font: 700 1.25rem var(--display); font-variant-numeric: tabular-nums; }
  .stat span { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .filters .checks { grid-column: 1 / -1; display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; }
  select, input[type=text], input[type=search], textarea {
    width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px;
  }
  label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: .92rem; }
  label.chk input { width: 18px; height: 18px; accent-color: var(--accent); }
  .btn { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 14px; font-weight: 500; min-height: 40px; }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: default; }
  .primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  .primary:hover { filter: brightness(1.08); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grow { flex: 1 1 auto; }
  .muted { color: var(--muted); }
  .seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .seg button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 6px; font-weight: 600; font-size: .9rem; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .tag { display: inline-block; font-size: .75rem; padding: 1px 8px; border-radius: 999px; background: var(--soft); color: var(--accent); font-weight: 600; }
  .icon { border: 0; background: transparent; padding: 6px; border-radius: 8px; color: var(--muted); line-height: 1; min-width: 34px; min-height: 34px; font-size: 1.1rem; }
  .icon:hover { background: var(--soft); color: var(--accent); }
  .icon.on { color: var(--star); }
  .icon svg { width: 18px; height: 18px; display: block; margin: auto; fill: currentColor; }
  /* study cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 10px; }
  .wcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; min-width: 0; }
  .wtop { display: flex; justify-content: space-between; gap: 6px; align-items: flex-start; }
  .de { font: 700 1.3rem/1.25 var(--display); overflow-wrap: anywhere; }
  .en { font-size: 1.1rem; overflow-wrap: anywhere; }
  .ar { font: 600 1.35rem/1.6 var(--arabic); overflow-wrap: anywhere; text-align: right; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
  .note { font-size: .85rem; color: var(--muted); }
  /* test */
  .bar { height: 6px; border-radius: 999px; background: var(--soft); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .qhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; font-size: .9rem; color: var(--muted); }
  .qword { font: 700 2.2rem/1.2 var(--display); overflow-wrap: anywhere; }
  .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
  @media (max-width: 560px) { .fields, .filters { grid-template-columns: minmax(0, 1fr); } .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .seg { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .field label { display: block; font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  .field input { font-size: 1.2rem; padding: 11px 12px; }
  .field input[dir=rtl] { font: 600 1.35rem var(--arabic); text-align: right; }
  .field.ok input { border-color: var(--good); background: var(--good-bg); }
  .field.bad input { border-color: var(--bad); background: var(--bad-bg); }
  .answer { margin-top: 4px; font-size: .95rem; color: var(--good); font-weight: 600; overflow-wrap: anywhere; }
  .answer[dir=rtl] { font: 700 1.2rem var(--arabic); text-align: right; }
  .verdict { margin-top: 12px; font-weight: 700; }
  .verdict.ok { color: var(--good); } .verdict.bad { color: var(--bad); }
  .opts { display: grid; gap: 8px; margin-top: 14px; }
  .opt { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 14px; width: 100%; }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt .oen { font-size: 1.05rem; min-width: 0; overflow-wrap: anywhere; }
  .opt .oar { font: 600 1.25rem var(--arabic); min-width: 0; overflow-wrap: anywhere; }
  .opt.ok { border-color: var(--good); background: var(--good-bg); }
  .opt.bad { border-color: var(--bad); background: var(--bad-bg); }
  .opt:disabled { cursor: default; color: inherit; }
  .back { margin-top: 14px; display: grid; gap: 4px; padding: 14px; border-radius: 10px; background: var(--soft); }
  .back .en { font-size: 1.3rem; font-weight: 600; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .summary { display: grid; gap: 10px; text-align: center; padding: 8px 0; }
  .summary .big { font: 700 2.6rem var(--display); }
  /* tables / lists */
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  td.ar { font-size: 1.15rem; text-align: right; }
  th.r { text-align: right; }
  .addgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 560px) { .addgrid { grid-template-columns: minmax(0, 1fr); } }
  textarea { min-height: 150px; font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; resize: vertical; }
  .msg { min-height: 1.4em; font-weight: 600; }
  .msg.ok { color: var(--good); } .msg.bad { color: var(--bad); }
  pre.fmt { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 12px; margin: 8px 0 0; }
  .qlabel { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .presets button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: .9rem; }
  .presets button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .sides { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 14px 0; }
  .side { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px 10px; margin: 0; min-width: 0; display: grid; gap: 4px; }
  .side legend { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding: 0 6px; }
  .optgrid { display: grid; gap: 8px; margin-top: 14px; }
  .qshow { min-width: 0; flex: 1 1 auto; display: grid; gap: 4px; }
  .qword.sm { font-size: 1.7rem; }
  .qword.ar { font: 700 2rem/1.5 var(--arabic); text-align: right; }
  .qword.sm.ar { font-size: 1.8rem; }
  .fields.one { grid-template-columns: minmax(0, 1fr); }
  .hint { margin-top: 4px; font: 600 1rem ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  .chars { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chars .btn { padding: 4px 12px; min-height: 36px; font-size: 1.05rem; }
  .back .bk { font-size: 1.3rem; font-weight: 600; overflow-wrap: anywhere; }
  .back .ar { font: 600 1.4rem/1.6 var(--arabic); text-align: right; }
  .catrow { grid-column: 1 / -1; }
  .pic { position: relative; aspect-ratio: 4 / 3; border: 1.5px dashed var(--line); border-radius: 10px; background: var(--bg); overflow: hidden; display: grid; place-items: center; margin-bottom: 4px; }
  .pic.has { border-style: solid; }
  .pic.over { border-color: var(--accent); background: var(--soft); }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .picadd { width: 100%; height: 100%; display: grid; place-items: center; text-align: center; cursor: pointer; color: var(--muted); font-weight: 600; font-size: .9rem; padding: 6px; }
  .picadd:hover { color: var(--accent); background: var(--soft); }
  .picbtns { position: absolute; top: 4px; right: 4px; display: flex; gap: 2px; background: rgba(0,0,0,.5); border-radius: 8px; }
  .picbtns .icon { color: #fff; cursor: pointer; display: grid; place-items: center; }
  .picbtns .icon:hover { background: rgba(255,255,255,.2); color: #fff; }
  .tpic { display: block; max-width: 100%; max-height: 220px; border-radius: 10px; margin-top: 12px; object-fit: contain; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Deutsch Duo</h1>
    <p class="sub">Build your own test: choose what you see and what you answer, in German, English and Arabic.</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-view="study" aria-selected="true">Study</button>
    <button class="tab" role="tab" data-view="test" aria-selected="false">Test</button>
    <button class="tab" role="tab" data-view="words" aria-selected="false">Words</button>
    <button class="tab" role="tab" data-view="data" aria-selected="false">Data</button>
  </nav>

  <section class="stats" id="stats" aria-label="Progress"></section>

  <section class="panel" id="filters">
    <div class="filters">
      <div class="catrow" id="fCats" role="group" aria-label="Categories"></div>
      <select id="fLevel" aria-label="Level"></select>
      <div class="checks">
        <label class="chk"><input type="checkbox" id="fFav"> Favorites</label>
        <label class="chk"><input type="checkbox" id="fDif"> Difficult</label>
        <label class="chk"><input type="checkbox" id="fHide"> Hide mastered</label>
        <label class="chk"><input type="checkbox" id="fShuffle"> Shuffle</label>
        <label class="chk"><input type="checkbox" id="fSpeak"> Speak German</label>
        <span class="muted" id="fCount"></span>
      </div>
    </div>
  </section>

  <section id="vStudy"><div class="row" style="margin-bottom:10px"><input type="search" id="sSearch" class="grow" placeholder="Search German, English or Arabic" autocomplete="off"></div><div class="cards" id="cards"></div></section>

  <section id="vTest" hidden><div class="panel" id="testArea"></div></section>

  <section id="vWords" hidden>
    <div class="panel" style="margin-bottom:12px">
      <h2>Add a word</h2>
      <div class="addgrid">
        <input type="text" id="aDe" placeholder="German, e.g. der Apfel" lang="de" autocomplete="off">
        <input type="text" id="aEn" placeholder="English" lang="en" dir="ltr" autocomplete="off">
        <input type="text" id="aAr" placeholder="العربية" lang="ar" dir="rtl" autocomplete="off" style="font-family:var(--arabic);font-size:1.1rem">
        <input type="text" id="aCat" placeholder="Category" autocomplete="off">
        <input type="text" id="aLvl" placeholder="Level, e.g. A1" autocomplete="off">
        <input type="text" id="aNote" placeholder="Notes" autocomplete="off">
      </div>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="aBtn">Add word</button><span class="msg" id="aMsg"></span></div>
    </div>
    <div class="panel tablewrap"><table id="wTable"></table></div>
  </section>

  <section id="vData" hidden>
    <div class="panel" style="margin-bottom:12px">
      <h2>Import your words</h2>
      <p class="muted" style="margin-top:0">Paste JSON or CSV with the columns <b>id, german, english, arabic, category, level, notes</b>. Several answers for one word can be separated with a slash, for example <b>to go / to walk</b>.</p>
      <textarea id="imp" placeholder='[{"id":1,"german":"der Apfel","english":"apple","arabic":"تفاحة","category":"Food","level":"A1","notes":""}]' spellcheck="false"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" id="impReplace">Replace my list</button>
        <button class="btn" id="impAdd">Add to my list</button>
        <label class="btn" for="impFile" style="display:inline-flex;align-items:center">Load file<input type="file" id="impFile" accept=".json,.csv,.txt,text/csv,application/json" hidden></label>
      </div>
      <div class="msg" id="impMsg" role="status"></div>
    </div>
    <div class="panel" style="margin-bottom:12px">
      <h2>Export</h2>
      <div class="row">
        <button class="btn" id="expJson">Download JSON</button>
        <button class="btn" id="expCsv">Download CSV</button>
        <button class="btn" id="expCopy">Copy JSON</button>
      </div>
      <p class="note" style="margin-bottom:0">Your progress is saved in this browser on this device. Export keeps your word list. Progress and noun pictures are not part of the export.</p>
    </div>
    <div class="panel">
      <h2>Reset</h2>
      <div class="row">
        <button class="btn" id="resetProg">Reset progress</button>
        <button class="btn" id="resetAll">Restore original list</button>
      </div>
      <div class="msg" id="resetMsg"></div>
    </div>
  </section>
</main>

<script>
"use strict";
const LS = "deutsch-duo-v2";
const MASTER_AT = 3;
const SPK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';

