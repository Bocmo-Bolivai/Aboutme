/* ---------- state ---------- */
function defaults() {
  return {
    words: SAMPLE.map(w => Object.assign({}, w)),
    prog: {},
    stats: { c: 0, w: 0, streak: 0, best: 0 },
    set: { mode: "type", cats: [], level: "", fav: false, dif: false, hideM: false, shuffle: true, speak: false, t: { show: ["german"], ask: ["english", "arabic"], len: 0, caps: false, umlaut: true, article: false, weak: false, pic: true, repeat: true } }
  };
}
function load() {
  const d = defaults();
  try {
    const r = JSON.parse(localStorage.getItem(LS));
    if (r && Array.isArray(r.words) && r.words.length) {
      d.words = r.words; d.prog = r.prog || {};
      d.stats = Object.assign(d.stats, r.stats); const dt = d.set.t; d.set = Object.assign(d.set, r.set); d.set.t = Object.assign({}, dt, r.set && r.set.t); if (!(r.set && r.set.t && "repeat" in r.set.t)) { d.set.t.len = 0; d.set.t.repeat = true; }
      if (!Array.isArray(d.set.cats)) d.set.cats = [];
      if (d.set.cat) { if (!d.set.cats.length) d.set.cats = [d.set.cat]; delete d.set.cat; }
    }
  } catch (e) {}
  return d;
}
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
let S = load();

/* ---------- noun pictures (IndexedDB, resized to fit) ---------- */
const PICS = {}; let picDB = null;
const isNoun = w => /^nouns?$/i.test(String(w.category || "").trim());
function picOpen() {
  return new Promise(res => {
    try {
      const r = indexedDB.open("deutsch-duo-pics", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("p");
      r.onsuccess = () => { picDB = r.result; res(); };
      r.onerror = () => res();
    } catch (e) { res(); }
  });
}
function picLoadAll() {
  return new Promise(res => {
    if (!picDB) return res();
    try {
      const rq = picDB.transaction("p").objectStore("p").openCursor();
      rq.onsuccess = () => { const c = rq.result; if (c) { PICS[c.key] = c.value; c.continue(); } else res(); };
      rq.onerror = () => res();
    } catch (e) { res(); }
  });
}
function picPut(id, url) { PICS[String(id)] = url; if (picDB) try { picDB.transaction("p", "readwrite").objectStore("p").put(url, String(id)); } catch (e) {} }
function picDel(id) { delete PICS[String(id)]; if (picDB) try { picDB.transaction("p", "readwrite").objectStore("p").delete(String(id)); } catch (e) {} }
function fileToPic(file, cb) {
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const M = 480, r = Math.min(1, M / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(img.width * r)); c.height = Math.max(1, Math.round(img.height * r));
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url); cb(c.toDataURL("image/jpeg", 0.85));
  };
  img.onerror = () => URL.revokeObjectURL(url);
  img.src = url;
}
function setPic(id, file) {
  if (!file || !/^image\//.test(file.type)) return;
  fileToPic(file, u => { picPut(id, u); if (view === "study") renderStudy(); });
}
function picBox(w) {
  const id = esc(key(w)), u = PICS[key(w)];
  return '<div class="pic' + (u ? " has" : "") + '" data-drop="' + id + '">' + (u
    ? '<img src="' + u + '" alt="' + esc(w.english || w.german) + '">' +
      '<div class="picbtns"><label class="icon" title="Change picture" aria-label="Change picture">✎<input type="file" accept="image/*" hidden data-pic="' + id + '"></label>' +
      '<button class="icon" data-act="picdel" data-id="' + id + '" title="Remove picture" aria-label="Remove picture">✕</button></div>'
    : '<label class="picadd"><span>＋ Add picture<br><small>tap, or drop an image here</small></span><input type="file" accept="image/*" hidden data-pic="' + id + '"></label>') + '</div>';
}
function testPic(w, t) {
  const u = PICS[key(w)];
  return t.pic !== false && isNoun(w) && u ? '<img class="tpic" src="' + u + '" alt="">' : "";
}
let view = "study";
let sess = null;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const key = w => String(w.id);
const byId = id => S.words.find(w => key(w) === String(id));
const prog = id => S.prog[String(id)] || { c: 0, w: 0, s: 0, fav: false, dif: false };
function pw(id) { const k = String(id); if (!S.prog[k]) S.prog[k] = { c: 0, w: 0, s: 0, fav: false, dif: false }; return S.prog[k]; }
const mastered = id => prog(id).s >= MASTER_AT;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function filtered() {
  const f = S.set;
  return S.words.filter(w => {
    const p = prog(w.id);
    if (f.cats.length && !f.cats.includes(w.category)) return false;
    if (f.level && w.level !== f.level) return false;
    if (f.fav && !p.fav) return false;
    if (f.dif && !p.dif) return false;
    if (f.hideM && p.s >= MASTER_AT) return false;
    return true;
  });
}

/* ---------- speech ---------- */
function say(text) {
  if (!("speechSynthesis" in window) || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "de-DE";
    const v = speechSynthesis.getVoices().find(x => /^de/i.test(x.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- answer checking ---------- */
const SEP = /[\/;,،|]+/;
function nEn(s) {
  return s.toLowerCase().normalize("NFC").replace(/\(.*?\)/g, " ").replace(/[.!?'’"]/g, "")
    .replace(/\s+/g, " ").trim().replace(/^(to|the|a|an) /, "");
}
function nAr(s) {
  return s.normalize("NFC").replace(/[.,!?؟'"()]/g, "").replace(/[ً-ٰٟـ]/g, "")
    .replace(/[أإآٱ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/\s+/g, " ").trim();
}
const stripAl = s => s.replace(/^ال(?=.{2,})/, "");
function variants(s, norm, extra) {
  const out = new Set();
  [s].concat(s.split(SEP)).forEach(p => { const n = norm(p); if (n) { out.add(n); if (extra) out.add(extra(n)); } });
  return Array.from(out);
}
function matches(input, expected, norm, extra) {
  if (!String(expected).trim()) return true;
  const E = new Set(variants(expected, norm, extra));
  return variants(input, norm, extra).some(v => E.has(v));
}

/* ---------- rendering: shared ---------- */
function renderStats() {
  const m = S.words.filter(w => mastered(w.id)).length;
  $("stats").innerHTML =
    '<div class="stat"><b>' + S.stats.c + '</b><span>Correct</span></div>' +
    '<div class="stat"><b>' + S.stats.w + '</b><span>Wrong</span></div>' +
    '<div class="stat"><b>' + S.stats.streak + '</b><span>Streak (best ' + S.stats.best + ')</span></div>' +
    '<div class="stat"><b>' + m + ' / ' + S.words.length + '</b><span>Mastered</span></div>';
}
function fillSelect(sel, label, values, current) {
  sel.innerHTML = '<option value="">' + label + '</option>' + values.map(v => '<option value="' + esc(v) + '"' + (v === current ? " selected" : "") + ">" + esc(v) + "</option>").join("");
}
function renderFilters() {
  const cats = Array.from(new Set(S.words.map(w => w.category).filter(Boolean))).sort();
  const lvls = Array.from(new Set(S.words.map(w => w.level).filter(Boolean))).sort();
  S.set.cats = S.set.cats.filter(c => cats.includes(c));
  if (S.set.level && !lvls.includes(S.set.level)) S.set.level = "";
  $("fCats").innerHTML = '<div class="qlabel">Categories: tap several to mix them</div><div class="presets"><button data-act="catall" aria-pressed="' + (!S.set.cats.length) + '">All</button>' +
    cats.map(c => '<button data-act="cat" data-c="' + esc(c) + '" aria-pressed="' + S.set.cats.includes(c) + '">' + esc(c) + '</button>').join("") + '</div>';
  fillSelect($("fLevel"), "All levels", lvls, S.set.level);
  $("fFav").checked = S.set.fav; $("fDif").checked = S.set.dif; $("fHide").checked = S.set.hideM;
  $("fShuffle").checked = S.set.shuffle; $("fSpeak").checked = S.set.speak;
  $("fCount").textContent = filtered().length + " of " + S.words.length + " words selected";
}
function flagBtns(id, noSay) {
  const p = prog(id);
  return (noSay ? "" : '<button class="icon" data-act="say" data-id="' + esc(id) + '" title="Hear German" aria-label="Hear German">' + SPK + '</button>') +
    '<button class="icon' + (p.fav ? " on" : "") + '" data-act="fav" data-id="' + esc(id) + '" title="Favorite" aria-label="Favorite" aria-pressed="' + p.fav + '">' + (p.fav ? "★" : "☆") + '</button>' +
    '<button class="icon' + (p.dif ? " on" : "") + '" data-act="dif" data-id="' + esc(id) + '" title="Mark as difficult" aria-label="Mark as difficult" aria-pressed="' + p.dif + '">⚑</button>';
}

/* ---------- study ---------- */
let studyLimit = 120;
function renderStudy() {
  const q = $("sSearch").value.trim().toLowerCase();
  let list = filtered();
  if (q) list = list.filter(w => (w.german + " " + w.english + " " + w.arabic).toLowerCase().includes(q));
  if (!list.length) { $("cards").innerHTML = '<p class="muted">No words match these filters.</p>'; return; }
  const total = list.length; list = list.slice(0, studyLimit);
  const more = total > list.length ? '<div style="grid-column:1/-1;text-align:center"><button class="btn" data-act="more">Show more (' + (total - list.length) + ' left)</button></div>' : "";
  $("cards").innerHTML = list.map(w => {
    const p = prog(w.id);
    return '<article class="wcard">' + (isNoun(w) ? picBox(w) : "") + '<div class="wtop"><div class="de" lang="de" dir="ltr">' + esc(w.german) + '</div><div class="row" style="flex:none;gap:0">' + flagBtns(w.id) + '</div></div>' +
      '<div class="en" lang="en" dir="ltr">' + esc(w.english) + '</div>' +
      '<div class="ar" lang="ar" dir="rtl">' + esc(w.arabic) + '</div>' +
      '<div class="meta">' + (w.category ? '<span class="tag">' + esc(w.category) + '</span>' : "") + (w.level ? '<span class="tag">' + esc(w.level) + '</span>' : "") +
      (p.s >= MASTER_AT ? '<span class="tag">Mastered</span>' : "") + '</div>' +
      (w.notes ? '<div class="note">' + esc(w.notes) + '</div>' : "") + '</article>';
  }).join("") + more;
}

/* ---------- test ---------- */
const LANGS = { german: "German", english: "English", arabic: "Arabic" };
const LKEY = { german: "de", english: "en", arabic: "ar" };
const ORDER = ["german", "english", "arabic"];
const MODES = [["type", "Type"], ["choice", "Choose"], ["flash", "Flashcard"], ["mixed", "Mixed"]];
const PRESETS = [
  ["German → English + Arabic", ["german"], ["english", "arabic"]],
  ["English + Arabic → German", ["english", "arabic"], ["german"]],
  ["English → German", ["english"], ["german"]],
  ["Arabic → German", ["arabic"], ["german"]],
  ["German → English", ["german"], ["english"]],
  ["German → Arabic", ["german"], ["arabic"]],
  ["English → Arabic", ["english"], ["arabic"]],
  ["Arabic → English", ["arabic"], ["english"]]
];
const orderLangs = a => ORDER.filter(l => a.includes(l));
const txt = (w, l) => String(w[l] == null ? "" : w[l]).trim();
function eligible(t) { t = t || S.set.t; return filtered().filter(w => t.show.concat(t.ask).every(l => txt(w, l))); }
function toggleSide(side, l) {
  const t = S.set.t, other = side === "show" ? "ask" : "show";
  let a = t[side].slice(), b = t[other].slice();
  if (a.includes(l)) { if (a.length === 1) return; a = a.filter(x => x !== l); }
  else { a.push(l); b = b.filter(x => x !== l); if (!b.length) { const free = ORDER.find(x => !a.includes(x)); if (!free) return; b = [free]; } }
  t[side] = orderLangs(a); t[other] = orderLangs(b);
}
function nDe(t) {
  return s => {
    s = s.normalize("NFC").replace(/[.,!?"'’]/g, "").replace(/\s+/g, " ").trim();
    if (!t.caps) s = s.toLowerCase();
    if (t.umlaut) s = s.replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").replace(/Ä/g, "Ae").replace(/Ö/g, "Oe").replace(/Ü/g, "Ue");
    if (!t.article) s = s.replace(/^(der|die|das|ein|eine) /i, "");
    return s;
  };
}
function checkField(l, input, expected, t) {
  if (l === "english") return matches(input, expected, nEn);
  if (l === "arabic") return matches(input, expected, nAr, stripAl);
  return matches(input, expected, nDe(t));
}
function startSession(ids) {
  const t = JSON.parse(JSON.stringify(S.set.t));
  let pool = ids || eligible(t).map(key);
  if (!pool.length) return;
  pool = pool.slice(); shuffle(pool);
  if (t.weak) pool.sort((a, b) => { const pa = prog(a), pb = prog(b); return (pa.s - pb.s) || (pb.w - pa.w); });
  if (t.len > 0 && !ids) pool = pool.slice(0, t.len);
  sess = { t, queue: pool, i: 0, ok: 0, bad: 0, missed: [], done: false, q: null, answered: false };
  nextQ();
}
function nextQ() {
  if (sess.i >= sess.queue.length) { sess.done = true; sess.q = null; renderTest(); return; }
  const w = byId(sess.queue[sess.i]), t = sess.t;
  if (!w) { sess.i++; return nextQ(); }
  const modes = ["type", "choice", "flash"];
  const mode = S.set.mode === "mixed" ? modes[Math.floor(Math.random() * 3)] : S.set.mode;
  const q = { w, mode, revealed: false, result: null, opts: [], vals: {}, ok: {}, hint: false, picked: null };
  if (mode === "choice") {
    const others = S.words.filter(x => key(x) !== key(w) && t.ask.every(l => txt(x, l)));
    const same = shuffle(others.filter(x => x.category === w.category));
    const rest = shuffle(others.filter(x => x.category !== w.category));
    const picked = [], used = new Set(t.ask.map(l => txt(w, l).toLowerCase()));
    for (const x of same.concat(rest)) {
      if (picked.length >= 3) break;
      const vals = t.ask.map(l => txt(x, l).toLowerCase());
      if (vals.some(v => used.has(v))) continue;
      vals.forEach(v => used.add(v)); picked.push(x);
    }
    q.opts = shuffle(picked.concat([w]));
  }
  sess.q = q; sess.answered = false;
  renderTest();
  if (S.set.speak && t.show.includes("german")) say(w.german);
  const first = document.querySelector(".tin"); if (first) first.focus();
}
function afterResult() { if (S.set.speak && sess && sess.q && !sess.t.show.includes("german")) say(sess.q.w.german); }
function record(ok) {
  const q = sess.q, p = pw(q.w.id);
  if (ok) { p.c++; p.s++; S.stats.c++; S.stats.streak++; S.stats.best = Math.max(S.stats.best, S.stats.streak); sess.ok++; }
  else { p.w++; p.s = 0; S.stats.w++; S.stats.streak = 0; sess.bad++; sess.missed.push(key(q.w));
    if (sess.t.repeat) { const lo = sess.i + 4, n = sess.queue.length, pos = lo >= n ? n : lo + Math.floor(Math.random() * (n - lo + 1)); sess.queue.splice(pos, 0, key(q.w)); } }
  q.result = ok; sess.answered = true;
  save(); renderStats();
}
function saveTyped() {
  if (!sess || !sess.q) return;
  document.querySelectorAll(".tin").forEach(i => { sess.q.vals[i.dataset.l] = i.value; });
}
function hintText(s) {
  const first = String(s).split(SEP)[0].trim();
  return first.charAt(0) + first.slice(1).replace(/[^\s]/g, " _").replace(/\s{2}/g, "  ") + "  (" + first.replace(/\s/g, "").length + ")";
}
function lineHtml(l, v, cls) {
  return '<div class="' + cls + (l === "arabic" ? " ar" : "") + '" lang="' + LKEY[l] + '" dir="' + (l === "arabic" ? "rtl" : "ltr") + '">' + esc(v) + '</div>';
}
function renderTest() {
  const el = $("testArea");
  if (sess && sess.q && sess.q.mode === "type" && sess.q.result === null) saveTyped();
  if (!sess) {
    const t = S.set.t, elig = eligible(), n = t.len > 0 ? Math.min(t.len, elig.length) : elig.length;
    const same = (a, b) => a.join() === b.join();
    const sideBox = (side, title) => '<fieldset class="side"><legend>' + title + '</legend>' + ORDER.map(l =>
      '<label class="chk"><input type="checkbox" data-act="tside" data-side="' + side + '" data-l="' + l + '"' + (t[side].includes(l) ? " checked" : "") + '> ' + LANGS[l] + '</label>').join("") + '</fieldset>';
    el.innerHTML = '<h2>Build your test</h2>' +
      '<div class="qlabel">Quick choices</div><div class="presets">' + PRESETS.map((p, i) => '<button data-act="preset" data-i="' + i + '" aria-pressed="' + (same(p[1], t.show) && same(p[2], t.ask)) + '">' + p[0] + '</button>').join("") + '</div>' +
      '<div class="sides">' + sideBox("show", "I see") + sideBox("ask", "I answer in") + '</div>' +
      '<div class="qlabel" style="margin-top:14px">Question type</div><div class="seg" role="group" aria-label="Question type">' + MODES.map(m => '<button data-act="mode" data-m="' + m[0] + '" aria-pressed="' + (S.set.mode === m[0]) + '">' + m[1] + '</button>').join("") + '</div>' +
      '<div class="optgrid">' +
        '<label class="chk">Words per round <select data-tset="len" style="width:auto">' + [0, 10, 20, 50, 100].map(v => '<option value="' + v + '"' + (t.len === v ? " selected" : "") + '>' + (v ? v : "All words, random order") + '</option>').join("") + '</select></label>' +
        '<label class="chk"><input type="checkbox" data-tset="repeat"' + (t.repeat ? " checked" : "") + '> Bring missed words back until I get them right</label>' +
        '<label class="chk"><input type="checkbox" data-tset="weak"' + (t.weak ? " checked" : "") + '> Weakest words first</label>' +
        '<label class="chk"><input type="checkbox" data-tset="pic"' + (t.pic ? " checked" : "") + '> Show noun pictures in the test</label>' +
        (t.ask.includes("german") ? '<label class="chk"><input type="checkbox" data-tset="caps"' + (t.caps ? " checked" : "") + '> Capital letters must be right</label>' +
        '<label class="chk"><input type="checkbox" data-tset="umlaut"' + (t.umlaut ? " checked" : "") + '> Accept ae / oe / ue / ss for ä ö ü ß</label>' +
        '<label class="chk"><input type="checkbox" data-tset="article"' + (t.article ? " checked" : "") + '> Article (der/die/das) required</label>' : "") +
      '</div>' +
      '<div class="actions"><button class="btn primary" data-act="start"' + (n ? "" : " disabled") + '>Start with ' + n + ' words</button></div>' +
      (n ? "" : '<p class="muted">No words have all the fields this test needs. Change the filters or the test.</p>') +
      (elig.length < filtered().length ? '<p class="note">' + (filtered().length - elig.length) + ' selected words are skipped because they lack one of these fields.</p>' : "");
    return;
  }
  if (sess.done) {
    const total = sess.ok + sess.bad, pct = total ? Math.round(sess.ok / total * 100) : 0;
    el.innerHTML = '<div class="summary"><div class="muted">Round finished</div><div class="big">' + pct + '%</div><div>' + sess.ok + ' correct, ' + sess.bad + ' wrong</div></div>' +
      '<div class="actions" style="justify-content:center">' + (sess.missed.length ? '<button class="btn primary" data-act="retry">Practice ' + sess.missed.filter((v, i, a) => a.indexOf(v) === i).length + ' missed</button>' : "") +
      '<button class="btn' + (sess.missed.length ? "" : " primary") + '" data-act="start">New round</button><button class="btn" data-act="quit">Change test</button></div>';
    return;
  }
  const q = sess.q, w = q.w, t = sess.t, r = q.result !== null, pct = Math.round(sess.i / sess.queue.length * 100);
  const gives = t.ask.map(l => LANGS[l]).join(" + ");
  let body = "";
  if (q.mode === "type") {
    body = '<div class="fields' + (t.ask.length === 1 ? " one" : "") + '">' + t.ask.map(l => {
      const ok = r && q.ok[l], ph = { german: "auf Deutsch", english: "in English", arabic: "بالعربية" }[l];
      return '<div class="field' + (r ? (ok ? " ok" : " bad") : "") + '"><label for="t_' + l + '">' + LANGS[l] + '</label>' +
        '<input class="tin" type="text" id="t_' + l + '" data-l="' + l + '" dir="' + (l === "arabic" ? "rtl" : "ltr") + '" lang="' + LKEY[l] + '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="' + ph + '"' + (r ? " disabled" : "") + ' value="' + esc(q.vals[l] || "") + '">' +
        (q.hint && !r ? '<div class="hint" dir="ltr">' + esc(hintText(w[l])) + '</div>' : "") +
        (r && !ok ? '<div class="answer" dir="' + (l === "arabic" ? "rtl" : "ltr") + '">' + esc(w[l]) + '</div>' : "") + '</div>';
    }).join("") + '</div>' +
      (!r && t.ask.includes("german") ? '<div class="chars" aria-label="German letters">' + ["ä", "ö", "ü", "ß", "Ä", "Ö", "Ü"].map(c => '<button type="button" class="btn" data-act="ch" data-c="' + c + '">' + c + '</button>').join("") + '</div>' : "") +
      (r ? '<div class="verdict ' + (q.result ? "ok" : "bad") + '">' + (q.result ? (t.ask.length > 1 ? "All correct" : "Correct") : (t.ask.length > 1 && q.n > 0 ? q.n + " of " + t.ask.length + " correct" : "Wrong")) + '</div>' : "") +
      '<div class="actions">' + (r ? '<button class="btn primary" data-act="next">Next</button>' : '<button class="btn primary" data-act="check">Check</button><button class="btn" data-act="hint">Hint</button><button class="btn" data-act="skip">I don\'t know</button>') + '</div>';
  } else if (q.mode === "choice") {
    body = '<div class="opts">' + q.opts.map((o, i) => {
      let cls = "";
      if (r) { if (key(o) === key(w)) cls = " ok"; else if (key(o) === q.picked) cls = " bad"; }
      return '<button class="opt' + cls + '" data-act="pick" data-id="' + esc(key(o)) + '"' + (r ? " disabled" : "") + '>' + t.ask.map((l, j) =>
        '<span class="' + (l === "arabic" ? "oar" : "oen") + '" dir="' + (l === "arabic" ? "rtl" : "ltr") + '" lang="' + LKEY[l] + '">' + (j === 0 ? (i + 1) + ". " : "") + esc(o[l]) + '</span>').join("") + '</button>';
    }).join("") + '</div>' +
      (r ? '<div class="verdict ' + (q.result ? "ok" : "bad") + '">' + (q.result ? "Correct" : "Wrong") + '</div><div class="actions"><button class="btn primary" data-act="next">Next</button></div>' : "");
  } else {
    body = (q.revealed ? '<div class="back">' + t.ask.map(l => lineHtml(l, w[l], l === "arabic" ? "" : "bk")).join("") + (w.notes ? '<div class="note">' + esc(w.notes) + '</div>' : "") + '</div>' : '<div class="back muted">Think of the ' + esc(gives) + ', then reveal.</div>') +
      '<div class="actions">' + (!q.revealed ? '<button class="btn primary" data-act="reveal">Reveal</button>' :
        (!r ? '<button class="btn primary" data-act="knew">I knew it</button><button class="btn" data-act="missed">Not yet</button>' : '<button class="btn primary" data-act="next">Next</button>')) + '</div>';
  }
  const showHtml = t.show.map((l, i) => lineHtml(l, w[l], i === 0 ? "qword" : "qword sm")).join("");
  const canSay = t.show.includes("german") || r;
  el.innerHTML = '<div class="qhead"><span>Question ' + (sess.i + 1) + ' of ' + sess.queue.length + '</span><span>' + sess.ok + ' correct · ' + sess.bad + ' wrong</span></div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="qlabel" style="margin-top:14px">Give the ' + esc(gives) + '</div>' +
    '<div class="wtop"><div class="qshow">' + showHtml + '</div><div class="row" style="flex:none;gap:0">' + flagBtns(w.id, !canSay) + '</div></div>' +
    (w.category || w.level ? '<div class="meta">' + (w.category ? '<span class="tag">' + esc(w.category) + '</span>' : "") + (w.level ? '<span class="tag">' + esc(w.level) + '</span>' : "") + '</div>' : "") +
    testPic(w, t) +
    body +
    '<div class="actions" style="margin-top:18px"><button class="btn" data-act="quit">End round</button></div>';
}
function checkTyped(skip) {
  const q = sess.q; if (q.result !== null) return;
  if (skip) q.vals = {}; else saveTyped();
  const t = sess.t; let n = 0;
  t.ask.forEach(l => { q.ok[l] = !skip && checkField(l, q.vals[l] || "", q.w[l], t); if (q.ok[l]) n++; });
  q.n = n; record(n === t.ask.length); renderTest(); afterResult();
}
function insertChar(c) {
  const i = document.getElementById("t_german"); if (!i) return;
  const s = i.selectionStart == null ? i.value.length : i.selectionStart, e = i.selectionEnd == null ? s : i.selectionEnd;
  i.value = i.value.slice(0, s) + c + i.value.slice(e); i.focus(); i.setSelectionRange(s + 1, s + 1);
}

/* ---------- words tab ---------- */
function renderWords() {
  $("wTable").innerHTML = '<thead><tr><th>German</th><th>English</th><th class="r">Arabic</th><th>Cat.</th><th>Lvl</th><th></th></tr></thead><tbody>' +
    S.words.map(w => '<tr><td lang="de">' + esc(w.german) + '</td><td lang="en">' + esc(w.english) + '</td><td class="ar" lang="ar" dir="rtl">' + esc(w.arabic) + '</td><td>' + esc(w.category) + '</td><td>' + esc(w.level) + '</td><td><button class="icon" data-act="del" data-id="' + esc(key(w)) + '" title="Delete" aria-label="Delete ' + esc(w.german) + '">✕</button></td></tr>').join("") + '</tbody>';
}

/* ---------- import / export ---------- */
function parseCSV(text) {
  text = text.replace(/^﻿/, "");
  const first = text.split(/\r?\n/)[0] || "";
  const d = [",", ";", "\t"].map(c => [c, first.split(c).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === d) { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); f = ""; if (row.some(x => x.trim() !== "")) rows.push(row); row = []; }
    else f += c;
  }
  row.push(f); if (row.some(x => x.trim() !== "")) rows.push(row);
  if (!rows.length) return [];
  const cols = ["id", "german", "english", "arabic", "category", "level", "notes"];
  const head = rows[0].map(h => h.trim().toLowerCase());
  let start = 0, map = cols.map((_, i) => i);
  if (head.includes("german")) { start = 1; map = cols.map(c => head.indexOf(c)); }
  return rows.slice(start).map(r => { const o = {}; cols.forEach((c, i) => { o[c] = map[i] >= 0 ? (r[map[i]] || "").trim() : ""; }); return o; });
}
function parseInput(text) {
  text = text.trim();
  if (!text) throw new Error("Paste your words first.");
  let arr;
  try { const j = JSON.parse(text); arr = Array.isArray(j) ? j : (j && Array.isArray(j.words) ? j.words : null); if (!arr) throw 0; }
  catch (e) { arr = parseCSV(text); }
  return arr;
}
function cleanWords(arr) {
  const out = [];
  arr.forEach(r => {
    if (!r || typeof r !== "object") return;
    const w = { id: r.id, german: String(r.german == null ? "" : r.german).trim(), english: String(r.english == null ? "" : r.english).trim(), arabic: String(r.arabic == null ? "" : r.arabic).trim(), category: String(r.category == null ? "" : r.category).trim(), level: String(r.level == null ? "" : r.level).trim(), notes: String(r.notes == null ? "" : r.notes).trim() };
    if (!w.german || (!w.english && !w.arabic)) return;
    out.push(w);
  });
  return out;
}
function assignIds(list, taken) {
  let next = 1; taken.forEach(k => { const n = Number(k); if (Number.isFinite(n) && n >= next) next = n + 1; });
  const seen = new Set(taken);
  list.forEach(w => {
    let id = w.id;
    if (id === undefined || id === null || id === "" || seen.has(String(id))) id = next++;
    else if (typeof id === "string" && /^\d+$/.test(id)) id = Number(id);
    w.id = id; seen.add(String(id));
  });
}
function doImport(replace) {
  const msg = $("impMsg");
  try {
    let list = cleanWords(parseInput($("imp").value));
    if (!list.length) throw new Error("No usable rows found. Each word needs german and at least english or arabic.");
    if (replace) {
      assignIds(list, []);
      const keep = {}; list.forEach(w => { if (S.prog[key(w)]) keep[key(w)] = S.prog[key(w)]; });
      S.words = list; S.prog = keep; sess = null;
    } else {
      const exist = new Set(S.words.map(w => w.german.toLowerCase() + "|" + w.english.toLowerCase()));
      list = list.filter(w => !exist.has(w.german.toLowerCase() + "|" + w.english.toLowerCase()));
      assignIds(list, S.words.map(key)); S.words = S.words.concat(list);
    }
    save(); msg.className = "msg ok"; msg.textContent = (replace ? "List replaced: " : "Added: ") + list.length + " words. Total now " + S.words.length + ".";
    $("imp").value = ""; refresh();
  } catch (e) { msg.className = "msg bad"; msg.textContent = e.message || "Could not read that. Check the format."; }
}
function download(name, text, type) {
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) {}
}
const exportJson = () => JSON.stringify(S.words.map(w => ({ id: w.id, german: w.german, english: w.english, arabic: w.arabic, category: w.category, level: w.level, notes: w.notes })), null, 2);
function exportCsv() {
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const cols = ["id", "german", "english", "arabic", "category", "level", "notes"];
  return "﻿" + cols.join(",") + "\r\n" + S.words.map(w => cols.map(c => q(w[c])).join(",")).join("\r\n");
}

/* ---------- navigation / refresh ---------- */
function setView(v) {
  view = v;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.view === v)));
  $("vStudy").hidden = v !== "study"; $("vTest").hidden = v !== "test"; $("vWords").hidden = v !== "words"; $("vData").hidden = v !== "data";
  $("filters").hidden = !(v === "study" || v === "test");
  refresh();
}
function refresh() {
  renderStats(); renderFilters();
  if (view === "study") renderStudy();
  if (view === "test") renderTest();
  if (view === "words") renderWords();
}
function setFlag(id, k) {
  const p = pw(id); p[k] = !p[k]; save();
  if (view === "study") { renderFilters(); renderStudy(); }
  else if (view === "test") { renderFilters(); document.querySelectorAll('[data-act="' + k + '"][data-id="' + id + '"]').forEach(b => { b.classList.toggle("on", p[k]); b.setAttribute("aria-pressed", p[k]); if (k === "fav") b.textContent = p[k] ? "★" : "☆"; }); }
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  if (act === "say") { const w = byId(id); if (w) say(w.german); }
  else if (act === "fav" || act === "dif") setFlag(id, act);
  else if (act === "del") { S.words = S.words.filter(w => key(w) !== String(id)); delete S.prog[String(id)]; picDel(id); sess = null; save(); refresh(); }
  else if (act === "cat") { const c = t.dataset.c, a = S.set.cats, i = a.indexOf(c); if (i >= 0) a.splice(i, 1); else a.push(c); studyLimit = 120; sess = null; save(); refresh(); }
  else if (act === "catall") { S.set.cats = []; studyLimit = 120; sess = null; save(); refresh(); }
  else if (act === "picdel") { picDel(id); renderStudy(); }
  else if (act === "more") { studyLimit += 120; renderStudy(); }
  else if (act === "mode") { S.set.mode = t.dataset.m; save(); renderTest(); }
  else if (act === "start") startSession();
  else if (act === "retry") startSession(sess.missed.filter((v, i, a) => a.indexOf(v) === i));
  else if (act === "quit") { sess = null; renderTest(); }
  else if (act === "check") checkTyped(false);
  else if (act === "skip") checkTyped(true);
  else if (act === "next") { sess.i++; nextQ(); }
  else if (act === "pick") { const q = sess.q; if (q.result !== null) return; q.picked = id; record(id === key(q.w)); renderTest(); afterResult(); }
  else if (act === "reveal") { sess.q.revealed = true; renderTest(); }
  else if (act === "knew") { record(true); renderTest(); afterResult(); }
  else if (act === "missed") { record(false); renderTest(); afterResult(); }
  else if (act === "preset") { const p = PRESETS[Number(t.dataset.i)]; S.set.t.show = p[1].slice(); S.set.t.ask = p[2].slice(); save(); renderTest(); }
  else if (act === "tside") { toggleSide(t.dataset.side, t.dataset.l); save(); renderTest(); }
  else if (act === "ch") insertChar(t.dataset.c);
  else if (act === "hint") { saveTyped(); sess.q.hint = true; renderTest(); const f = Array.from(document.querySelectorAll(".tin")).find(i => !i.value) || document.querySelector(".tin"); if (f) f.focus(); }
});
document.addEventListener("keydown", e => {
  if (view !== "test" || !sess || sess.done || !sess.q) return;
  const q = sess.q, tag = (e.target.tagName || "").toLowerCase();
  if (e.key === "Enter") {
    if (q.result !== null) { e.preventDefault(); sess.i++; nextQ(); }
    else if (q.mode === "type" && e.target.classList && e.target.classList.contains("tin")) {
      e.preventDefault();
      const ins = Array.from(document.querySelectorAll(".tin")), i = ins.indexOf(e.target);
      if (i < ins.length - 1) ins[i + 1].focus(); else checkTyped(false);
    } else if (q.mode === "flash" && !q.revealed && tag !== "button") { e.preventDefault(); q.revealed = true; renderTest(); }
  } else if (q.mode === "choice" && q.result === null && /^[1-4]$/.test(e.key) && tag !== "input") {
    const o = q.opts[Number(e.key) - 1]; if (o) { q.picked = key(o); record(key(o) === key(q.w)); renderTest(); afterResult(); }
  }
});
$("testArea").addEventListener("change", e => {
  const k = e.target.dataset && e.target.dataset.tset; if (!k) return;
  const t = S.set.t; if (k === "len") t.len = Number(e.target.value); else t[k] = e.target.checked;
  save(); renderTest();
});
document.addEventListener("change", e => { const t = e.target; if (t.dataset && t.dataset.pic) { setPic(t.dataset.pic, t.files[0]); t.value = ""; } });
const dropEl = e => e.target.closest && e.target.closest("[data-drop]");
document.addEventListener("dragover", e => { const d = dropEl(e); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = dropEl(e); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = dropEl(e); if (!d) return; e.preventDefault(); d.classList.remove("over"); setPic(d.dataset.drop, e.dataTransfer.files[0]); });
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => setView(t.dataset.view)));
$("fLevel").onchange = e => { S.set.level = e.target.value; studyLimit = 120; sess = null; save(); refresh(); };
[["fFav", "fav"], ["fDif", "dif"], ["fHide", "hideM"], ["fShuffle", "shuffle"], ["fSpeak", "speak"]].forEach(([id, k]) => {
  $(id).onchange = e => { S.set[k] = e.target.checked; if (k !== "shuffle" && k !== "speak") sess = null; save(); refresh(); };
});
$("sSearch").oninput = () => { studyLimit = 120; renderStudy(); };
$("aBtn").onclick = () => {
  const m = $("aMsg"), de = $("aDe").value.trim(), en = $("aEn").value.trim(), ar = $("aAr").value.trim();
  if (!de || (!en && !ar)) { m.className = "msg bad"; m.textContent = "Enter the German word and its English or Arabic."; return; }
  const w = { id: null, german: de, english: en, arabic: ar, category: $("aCat").value.trim(), level: $("aLvl").value.trim(), notes: $("aNote").value.trim() };
  assignIds([w], S.words.map(key)); S.words.push(w); save();
  ["aDe", "aEn", "aAr", "aNote"].forEach(i => $(i).value = ""); m.className = "msg ok"; m.textContent = "Added."; refresh();
};
$("impReplace").onclick = () => doImport(true);
$("impAdd").onclick = () => doImport(false);
$("impFile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => { $("imp").value = String(r.result); $("impMsg").className = "msg"; $("impMsg").textContent = "File loaded. Choose Replace or Add."; }; r.readAsText(f); e.target.value = "";
};
$("expJson").onclick = () => download("german-words.json", exportJson(), "application/json");
$("expCsv").onclick = () => download("german-words.csv", exportCsv(), "text/csv;charset=utf-8");
$("expCopy").onclick = async () => {
  const m = $("impMsg");
  try { await navigator.clipboard.writeText(exportJson()); m.className = "msg ok"; m.textContent = "JSON copied."; }
  catch (e) { $("imp").value = exportJson(); $("imp").select(); m.className = "msg"; m.textContent = "Copy blocked. The JSON is in the box above, select it and copy."; }
};
$("resetProg").onclick = () => { if (!confirm("Reset all progress? Your words stay.")) return; S.prog = {}; S.stats = { c: 0, w: 0, streak: 0, best: 0 }; sess = null; save(); $("resetMsg").className = "msg ok"; $("resetMsg").textContent = "Progress reset."; refresh(); };
$("resetAll").onclick = () => { if (!confirm("Replace your list with the original 1,954 words and reset progress?")) return; const keepSet = S.set; S = defaults(); S.set = keepSet; sess = null; save(); $("resetMsg").className = "msg ok"; $("resetMsg").textContent = "Original list restored."; refresh(); };

if ("speechSynthesis" in window) { try { speechSynthesis.getVoices(); } catch (e) {} }
setView("study");
picOpen().then(picLoadAll).then(() => refresh());
</script>
</body>
</html>
